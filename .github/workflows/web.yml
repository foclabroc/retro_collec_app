# Pixel Trade — version web : compilée et publiée automatiquement sur GitHub Pages
# à chaque push sur main → https://foclabroc.github.io/retro_collec_app/
# (Réglage une seule fois : Settings > Pages > Source : « GitHub Actions »)
name: Version web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilation
        # --wasm : WebAssembly pour Chrome / Edge / Firefox, JavaScript gardé automatiquement pour Safari et les autres
        # en cas d'erreur, les lignes « Error » remontent en annotations (lisibles sans les journaux)
        run: |
          set -o pipefail
          flutter build web --release --wasm --base-href /retro_collec_app/ 2>&1 | tee build.log || {
            grep -E "Error|error:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
