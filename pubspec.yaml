name: retro_collec
description: Pixel Trade — collection multijoueur de boîtes de jeux rétro (paquets, échanges, marché) by foclabroc
publish_to: 'none'
version: 1.0.30+31

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  crypto: ^3.0.3
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  web: ^1.1.0
  url_launcher: ^6.2.0
  open_filex: ^4.3.2
  archive: ^3.6.1
  sensors_plus: ^6.1.1
  google_fonts: ^6.2.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/music/
    - assets/logos/
    - assets/consoles/
    - assets/tabs/
    - assets/sagas/
    - assets/houses/
    - assets/arcade/
    - assets/avatars/
    - assets/bs/
    - assets/google_fonts/
    - assets/card_back.jpg
    - assets/booster_front.webp
    - assets/booster_back.webp

# Icônes déjà générées dans android/res (premier plan pleine taille : inset 0 % dans mipmap-anydpi-v26/ic_launcher.xml)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/icon_bg.png"
  adaptive_icon_foreground: "assets/icon_fg.png"
