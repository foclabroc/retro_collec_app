<style>
:root{--bg:#0f1220;--panel:#181c30;--panel2:#20253d;--line:#2c3252;--text:#e8eaf6;--mute:#8a90b4;--acc:#ffcc33;--acc2:#3fd0ff;--ok:#3ee08f;--bad:#ff5a6e;--warn:#ff9f40;--violet:#b07cff;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.5px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:#0b0e19;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:6px 8px 12px}
.logo .px{font-size:11px;color:var(--acc);line-height:1.6}
.logo .ic{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--warn));display:grid;place-items:center;font-size:18px}
.navgrp{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:1.2px;margin:12px 10px 4px}
nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}

nav button.on{background:var(--panel2);color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
nav button.soon{color:var(--mute)}
nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
nav .badge.w{background:var(--warn)}
main{padding:20px 26px 60px;max-width:1440px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:14px;margin:0;color:var(--acc)}
.sp{flex:1}
.who{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h4{margin:16px 0 8px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g64{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.mt{margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.stat:hover{border-color:var(--acc)}
.stat .n{font-size:22px;font-weight:700;margin-top:4px}
.stat .l,.mini .l{color:var(--mute);font-size:12px}
.stat .d{font-size:11px;color:var(--mute)}
.mini{background:var(--panel2);border-radius:8px;padding:10px}
.mini .n{font-size:18px;font-weight:700}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mute);font-weight:500;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-k]{cursor:pointer}th[data-k]:hover{color:var(--text)}th.sorted{color:var(--acc)}
td{padding:7px 8px;border-bottom:1px solid #22274180}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:#ffffff08}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.ok{background:#3ee08f22;color:var(--ok)}.pill.bad{background:#ff5a6e22;color:var(--bad)}.pill.warn{background:#ff9f4022;color:var(--warn)}.pill.acc{background:#ffcc3322;color:var(--acc)}.pill.blue{background:#3fd0ff22;color:var(--acc2)}.pill.vi{background:#b07cff22;color:var(--violet)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}

textarea{min-height:70px;resize:vertical}
label{display:block;font-size:11px;color:var(--mute);margin:10px 0 4px}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.fc.f1 .fc-f::after,.fc.f3 .fc-f::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,#ff5ec433 30%,#5ee7ff40 42%,#c6ff5e33 54%,#ffd65e33 64%,transparent 76%);background-size:250% 250%;animation:holo 4s linear infinite;mix-blend-mode:screen}
@keyframes holo{from{background-position:0% 0%}to{background-position:-250% -250%}}

<script>
'use strict';
// ═════════════════════════════ API ═════════════════════════════
const API = 'https://api.foclabroc.duckdns.org/rest/v1/rpc/';
const KEY = 'sb_publishable_M1Rdee-lSEzCfq81zjYq5Q_NgJ0a35z';
const SALT = 'rc-collec#7b2e-foc';
let D = null;            // identifiant secret du compte admin (gardé dans ce navigateur)
let ME = '';

async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const sig = s => sha256(SALT + '|' + s);

async function rpc(fn, body) {
  let res;
  try {
    res = await fetch(API + fn, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch (_) { throw new Error('Pas de connexion au serveur'); }
  if ([502, 503, 504].includes(res.status)) throw new Error('Serveur indisponible');
  const txt = await res.text();
  if (res.status >= 300) {
    let m = 'HTTP ' + res.status;
    try { const j = JSON.parse(txt); if (j.message) m = j.message; } catch (_) {}
    throw new Error(m);
  }
  return txt ? JSON.parse(txt) : null;
}
async function adm(fn, payload, extra = {}) {
  return rpc(fn, { p_device: D, p_sig: await sig(D + '|admin|' + payload), ...extra });
}
async function X(op, args = {}) {
  const s = JSON.stringify(args);
  return adm('rc_admin_x', 'x|' + op + '|' + s, { p_op: op, p_args: s });
}

// ═════════════════════════════ OUTILS ═════════════════════════════
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fr = n => (n == null || n === '' ? '—' : Number(n).toLocaleString('fr-FR'));

}
function heat(cells) {   // [[dow0-6, h, n]]

function spark(pts, color = '#ffcc33') {

}

async function tryLogin() {
  const n = $('#lg_name').value.trim(), p = $('#lg_pass').value;
  $('#lg_msg').textContent = '';
  if (!n || !p) return;
  $('#lg_go').disabled = true;
  try {
    const dev = await rpc('rc_login', { p_name: n, p_hash: await sha256('pt-pass#41c9|' + p) });
    if (typeof dev !== 'string' || dev.length !== 32) throw new Error('identifiants incorrects');
    D = dev;
    if (!(await adm('rc_admin_check', 'check'))) { D = null; throw new Error("ce compte n'est pas admin"); }
    try { localStorage.setItem('pta_dev', dev); } catch (_) {}
    start();
  } catch (e) { $('#lg_msg').textContent = e.message; }
  $('#lg_go').disabled = false;
}
$('#lg_go').onclick = tryLogin;
$('#lg_pass').onkeydown = e => { if (e.key === 'Enter') tryLogin(); };
$('#logout').onclick = () => { try { localStorage.removeItem('pta_dev'); } catch (_) {} location.reload(); };

  };
};

        <div><label>Roue : un tour toutes les</label><select id="whh">${opt(withCur([[4, '4 h'], [6, '6 h'], [8, '8 h'], [12, '12 h (normal)'], [24, '24 h']], live.wheel_hours ?? 12), live.wheel_hours ?? 12)}</select></div></div>

// ═════════════════════════════ RECHERCHE RAPIDE ═════════════════════════════
let CMDL = [];
async function openCmd() {
  $('#cmd').classList.add('on'); $('#cmdin').value = ''; $('#cmdin').focus();
  await players().catch(() => {});
  CMDL = [...$$('nav button[data-s]').map(b => ['📄 ' + b.textContent.replace(/\d+\s*$/, '').trim(), () => go(b.dataset.s)]),
    ...(PL || []).map(p => ['👤 ' + p.name, () => { closeCmd(); openPlayer(p.pid); }])];
  drawCmd('');
}
function closeCmd() { $('#cmd').classList.remove('on'); }
function drawCmd(q) {
  q = q.toLowerCase();
  let r = CMDL.filter(c => c[0].toLowerCase().includes(q));
  if (q.length >= 3 && CAT) r = r.concat(Object.entries(CAT).filter(([id, c]) => c[2].toLowerCase().includes(q)).slice(0, 5).map(([id, c]) => ['🃏 ' + c[2] + ' · ' + sysName(c[0]), () => { go('cards'); setTimeout(() => { $('#cd_q').value = c[2]; $('#cd_q').oninput(); }, 50); }]));
  drawCmd.r = r.slice(0, 10);
  $('#cmdres').innerHTML = drawCmd.r.map((c, i) => `<div class="it${i ? '' : ' on'}" data-i="${i}">${esc(c[0])}</div>`).join('') || '<div class="empty">Rien</div>';
}
$('#cmdin').oninput = e => drawCmd(e.target.value);
$('#cmdres').onclick = e => { const it = e.target.closest('.it'); if (it) drawCmd.r[+it.dataset.i][1](); };
$('#cmdin').onkeydown = e => { if (e.key === 'Enter' && drawCmd.r?.[0]) drawCmd.r[0][1](); };
$('#cmd').onclick = e => { if (e.target.id === 'cmd') closeCmd(); };
$('#opencmd').onclick = openCmd;
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && D) { e.preventDefault(); openCmd(); } });
</script>
