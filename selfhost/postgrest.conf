# PostgREST — API des RPC de Pixel Trade (remplace l'API REST de Supabase)
# Lancement : postgrest.exe postgrest.conf  (en service Windows via NSSM)

db-uri = "postgres://authenticator:CHANGE_MOI_POSTGREST@127.0.0.1:5432/postgres"
db-schemas = "public"
db-anon-role = "anon"
db-pool = 10

# L'appli n'envoie pas de JWT (clé publique sb_publishable_…) : tout passe en « anon ».
# Secret obligatoire mais inutilisé : mettre au moins 32 caractères au hasard.
jwt-secret = "CHANGE_MOI_32_CARACTERES_MINIMUM_AU_HASARD"

# Écoute seulement en local : seul Caddy est exposé sur Internet
server-host = "127.0.0.1"
server-port = 3000

log-level = "warn"

# Pas de description publique de l'API (liste des fonctions et tables) sur /rest/v1/
openapi-mode = "disabled"
